    <main>
        <div class="hero" id="contact">
            <h2>Contact Us</h2>
            <p>We’d love to hear from you — reach out anytime.</p>
        </div>

        <section class="contact-info" aria-label="Contact Idika">
            <div class="contact-card">
                <h3><img src="../assets/images/email-us.png" alt=""> Email Us</h3>
                <p><a href="mailto:hello@zaikajaroori.com">hello@zaikajaroori.com</a></p>
            </div>

            <div class="contact-card">
                <h3><img src="../assets/images/call-us.png" alt=""> Call Us</h3>
                <p><a href="tel:+918693006186">+91 869 300 6186</a></p>
            </div>

            <div class="contact-card">
                <h3><img src="../assets/images/follow-us.png" alt=""> Follow Us</h3>
                <p>
                    <a aria-label="Instagram" href="https://www.instagram.com/Zaikajaroori" target="_blank" rel="noopener noreferrer">
                        <i class="bi bi-instagram social-icon" aria-hidden="true"></i>
                    </a>
                    <a aria-label="Facebook" href="https://www.facebook.com/Zaikajaroori" target="_blank" rel="noopener noreferrer">

                    </a>

                        <i class="bi bi-youtube social-icon" aria-hidden="true"></i>
                    </a>
                </p>
            </div>
        </section>

        <section class="form-section">
            <h2>Send Us a Message</h2>
            <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                <input type="text" name="name" placeholder="Your Name" aria-label="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" aria-label="Your Email" required>
                <textarea name="message" rows="5" placeholder="Your Message" aria-label="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
